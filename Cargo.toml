[package]
name = "jjwt"
version = "0.2.1"
edition = "2024"
description = "jujutsu-backed worktrunk-compatible workspace manager"
authors = ["Endoze <endoze@endozemedia.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/endoze/jjwt"
documentation = "https://docs.rs/jjwt"
rust-version = "1.97.1"
keywords = ["jujutsu", "jj", "workspace", "cli", "worktree"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  ".cargo-crap.toml",
  ".github/",
  ".gitignore",
  ".config/",
  "dist-workspace.toml",
  "flake.nix",
  "lcov.info",
  "release-plz.toml",
  "fixtures/",
  "docs/",
  "tests/",
]

[features]
default = ["picker", "syntax-highlighting"]
picker = ["dep:skim"]
# Syntax-highlight hook commands echoed before execution (requires tree-sitter).
syntax-highlighting = ["dep:tree-sitter", "dep:tree-sitter-bash", "dep:tree-sitter-highlight"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "jjwt"
path = "src/main.rs"

[dependencies]
anstyle = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
# In-process jj backend — eliminates subprocess spawning. PINNED EXACT
# because jj-lib has no API stability guarantee (pre-1.0).
jj-lib = { version = "=0.47.1", features = ["git"] }
minijinja = "3"
# Wordlists for the `codename` template filter. Pinned exactly to match
# worktrunk's own exact pin, so codenames match worktrunk's byte for byte.
# Bump only in lockstep with worktrunk: a different version shifts every
# codename-derived worktree path and orphans existing worktrees.
petname = { version = "=3.2.0", default-features = false, features = ["default-words"] }
petname-macros = "=3.2.0"
sanitize-filename = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
skim = { version = "5", optional = true }
thiserror = "2"
# Syntax highlighting for hook command echoes (feature `syntax-highlighting`).
# tree-sitter and tree-sitter-highlight track matching versions; tree-sitter-bash
# may lag behind (0.25.x works with tree-sitter 0.27.x).
tree-sitter = { version = "0.27", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-highlight = { version = "0.27", optional = true }
toml = { version = "1", features = ["preserve_order"] }
pollster = "1"
terminal_size = "0.4"
unicode-width = "0.2"
walkdir = "2"
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
